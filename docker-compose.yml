services:

  postgres:
    image: postgres:16-alpine
    container_name: codecollab-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: codecollab
      POSTGRES_USER: codecollab
      POSTGRES_PASSWORD: codecollab
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecollab -d codecollab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecollab-net

  redis:
    image: redis:7-alpine
    container_name: codecollab-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecollab-net

volumes:
  postgres_data:
  redis_data:

networks:
  codecollab-net:
    driver: bridge
