spring:
  application:
    name: codecollab
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
    open-in-view: false


  flyway:
    enabled: true
    # Allow Flyway to baseline existing schemas on first run
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8

  jackson:
    # Omit null fields from all API responses for cleaner contracts
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.codecollab: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

codecollab:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-characters-long-secret}
    expiration-seconds: 86400
    issuer: codecollab
  search:
    cache-ttl-seconds: 60
    max-tags-per-snippet: 10
    max-tags-returned: 200
  tags:
    recent-search-limit: 10
  ast:
    cache-ttl-minutes: 10
    max-code-length: 50000
  async:
    analysis-core-pool: 2
    analysis-max-pool: 4
    analysis-queue-capacity: 100
